<main id="sheet"></main>
<dialog class="viewer" id="viewer" aria-label="Full-size shot"></dialog>
<script>
  const data = JSON.parse(document.getElementById('sheet-data').textContent);

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  // Shots are captured at 2x, so half the natural width shows them at true size and never upscales. A zoom
  // shows every captured pixel instead, capped at its column, so the changed element reads large.
  function shot(src, alt, zoomed) {
    if (!src) return el('div', 'none', 'Not captured');
    const figure = el('figure');
    const link = el('button');
    link.type = 'button';
    link.onclick = () => openViewer(src, alt);
    const img = el('img');
    img.alt = alt;
    img.loading = 'lazy';
    img.onload = () => { img.style.width = img.naturalWidth / (zoomed ? 1 : 2) + 'px'; };
    img.src = src;
    link.append(img);
    figure.append(link);
    return figure;
  }

  // The artifact viewer blocks a link to a published file, so a shot opens full size in the page itself.
  const viewer = document.getElementById('viewer');
  viewer.onclick = () => viewer.close();
  function openViewer(src, alt) {
    const img = el('img');
    img.alt = alt;
    img.src = src;
    viewer.replaceChildren(img);
    viewer.showModal();
  }

  function themePair(pair, label) {
    const grid = el('div', 'themes');
    for (const theme of ['light', 'dark']) {
      const col = el('div');
      col.append(el('div', 'colhead', theme === 'light' ? 'Light' : 'Dark'), shot(pair && pair[theme], `${label}, ${theme}`));
      grid.append(col);
    }
    return grid;
  }

  function section(title, ...children) {
    const node = el('section');
    node.append(el('h2', '', title), ...children);
    return node;
  }

  function list(items, ordered) {
    const node = el(ordered ? 'ol' : 'ul');
    items.forEach((text) => node.append(el('li', '', text)));
    return node;
  }

  function table(headers) {
    const node = el('table');
    const head = el('tr');
    headers.forEach((h) => head.append(el('th', '', h)));
    node.append(head);
    return node;
  }

  function td(child) {
    const cell = el('td');
    cell.append(child);
    return cell;
  }

  // Colours are parsed by the browser, so any CSS colour syntax works, and laid over their ground before
  // the WCAG ratio is taken: the ratio is the one a person sees, never a number typed into the data.
  const paint = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
  function rgba(css) {
    paint.clearRect(0, 0, 1, 1);
    paint.fillStyle = 'rgba(0, 0, 0, 0)';
    paint.fillStyle = css;
    paint.fillRect(0, 0, 1, 1);
    const [r, g, b, a] = paint.getImageData(0, 0, 1, 1).data;
    return { r, g, b, a: a / 255 };
  }
  function over(top, under) {
    const mix = (k) => Math.round(top[k] * top.a + under[k] * (1 - top.a));
    return { r: mix('r'), g: mix('g'), b: mix('b'), a: 1 };
  }
  function luminance(c) {
    const lin = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
    return 0.2126 * lin(c.r) + 0.7152 * lin(c.g) + 0.0722 * lin(c.b);
  }
  function measure(side) {
    if (![side.text, side.ground, side.tint].filter(Boolean).every((c) => CSS.supports('color', c))) return null;
    let ground = rgba(side.ground);
    if (ground.a < 1) return { error: `Ground ${side.ground} is see-through; give the opaque surface as ground and the layer as tint` };
    if (side.tint) ground = over(rgba(side.tint), ground);
    const ink = over(rgba(side.text), ground);
    const [hi, lo] = [luminance(ink), luminance(ground)].sort((a, b) => b - a);
    return { ground: `rgb(${ground.r}, ${ground.g}, ${ground.b})`, ratio: Math.round(((hi + 0.05) / (lo + 0.05)) * 10) / 10 };
  }

  // The summary is read at a glance: three lines at full width. Below desktop width it wraps more, which
  // is fine, so it is measured only where the sheet is as wide as it gets.
  function flagLongSummary(summary, minWidth) {
    if (window.innerWidth < minWidth) return;
    const lines = Math.round(summary.offsetHeight / parseFloat(getComputedStyle(summary).lineHeight));
    if (lines > 3) summary.after(el('p', 'too-long', `This summary runs ${lines} lines; cut it to 3.`));
  }

  function header() {
    const node = el('header');
    const meta = el('div', 'meta');
    meta.append(el('span', 'ref', data.ref), el('span', 'chip', data.status), el('span', '', `Round ${data.round}`));
    node.append(meta, el('h1', '', data.title), el('p', 'summary', data.summary));
    requestAnimationFrame(() => flagLongSummary(node.querySelector('.summary'), 1200));
    return node;
  }

  function changesSection() {
    const items = data.round > 1 ? data.changes : ['First round: nothing to compare yet.'];
    return section('What Changed Since the Last Round', list(items));
  }

  function lookFor(text) {
    const node = el('p', 'look');
    node.append(el('b', '', 'Look for: '), document.createTextNode(text));
    return node;
  }

  function swatch(side, target) {
    const cell = el('div', 'swatch');
    const m = measure(side);
    if (!m || m.error) {
      cell.append(el('span', 'pill fail', m ? m.error : `Not a colour: ${[side.text, side.ground, side.tint].filter(Boolean).join(', ')}`));
      return { cell, ratio: null };
    }
    const sample = el('span', 'sample', 'Aa');
    sample.style.color = side.text;
    sample.style.background = m.ground;
    const hex = el('span', 'hex');
    hex.append(el('code', '', side.text), el('span', `pill ${m.ratio >= target ? 'pass' : 'fail'}`, `${m.ratio}:1`));
    cell.append(sample, hex);
    return { cell, ratio: m.ratio };
  }

  // The after colour decides first: a change that breaks a passing colour must never read as a pass.
  function verdict(before, after, target, isNew) {
    const passedBefore = before !== null && before >= target;
    if (after === null) return el('span', 'pill fail', 'After colour could not be measured');
    if (isNew) return el('span', `pill ${after < target ? 'fail' : 'pass'}`, after < target ? 'New colour, below target' : 'New colour, passes');
    if (after < target) return el('span', 'pill fail', passedBefore ? 'Now below target' : 'Still below target');
    return passedBefore ? el('span', 'pill same', 'Already passed; changed to match') : el('span', 'pill pass', 'Now passes');
  }

  function findingsSection() {
    const items = data.findings.map((f) => {
      const node = el('div', 'check');
      const head = el('div', 'check-head');
      head.append(el('span', `level ${f.level}`, f.level), el('code', '', f.area), el('span', 'source', f.where || ''));
      node.append(head, el('div', '', f.text));
      if (f.fix) node.append(el('div', 'check-note', `Fix: ${f.fix}`));
      return node;
    });
    return section('Findings, in the Order to Fix Them', ...items);
  }

  function colorsSection() {
    const node = el('table', 'colors');
    const head = el('tr');
    ['Token', 'Theme and surface', 'Target', 'Before', 'After', 'Result'].forEach((h) => head.append(el('th', '', h)));
    node.append(head);
    data.colors.forEach((c) => {
      const target = c.target || 4.5;
      const before = c.before ? swatch(c.before, target) : { cell: el('div', 'none', 'New colour: no before'), ratio: null };
      const after = swatch(c.after, target);
      const name = el('td');
      name.append(el('code', '', c.token), el('div', 'where', c.where));
      const row = el('tr');
      row.append(name, el('td', '', `${c.theme}, on ${c.surface}`), el('td', '', `${target}:1`), td(before.cell), td(after.cell), td(verdict(before.ratio, after.ratio, target, !c.before)));
      node.append(row);
    });
    const scroll = el('div', 'table-scroll');
    scroll.dataset.scrollX = '';
    scroll.append(node);
    return section('Colour Changes', el('p', 'look', 'Each sample shows the text colour on the surface it sits on. Ratios are computed from these values, with any see-through tint laid over its ground.'), scroll);
  }

  // Each crop carries its own caption, so the grid can stack to one column on a phone and stay readable.
  function zoomsSection() {
    const columns = [['before', data.beforeLabel || 'Before (main)'], ['after', data.afterLabel || 'After (this branch)']];
    const blocks = data.zooms.map((z) => {
      const wrap = el('div', 'zoom');
      const grid = el('div', 'zoom-grid');
      for (const theme of ['light', 'dark']) {
        for (const [name, heading] of columns) {
          const cellNode = el('div');
          const shots = z[name];
          cellNode.append(el('div', 'colhead', `${heading}, ${theme}`), shot(shots && shots[theme], `${z.label}, ${name}, ${theme}`, true));
          grid.append(cellNode);
        }
      }
      wrap.append(el('h3', '', z.label), lookFor(z.lookFor), grid);
      return wrap;
    });
    return section('Zoomed In', ...blocks);
  }

  function beforeAfterSection() {
    const blocks = data.beforeAfter.map((item) => {
      const wrap = el('div');
      const grid = el('div', 'pair');
      grid.append(el('div'), el('div', 'colhead', data.beforeLabel || 'Before (main)'), el('div', 'colhead', data.afterLabel || 'After (this branch)'));
      for (const theme of ['light', 'dark']) {
        grid.append(el('div', 'colhead', theme === 'light' ? 'Light' : 'Dark'));
        for (const [name, shots] of [['before', item.before], ['after', item.after]]) {
          grid.append(shots ? shot(shots[theme], `${item.label}, ${name}, ${theme}`) : el('div', 'none', 'New screen: no before state'));
        }
      }
      wrap.append(el('h3', '', item.label));
      if (item.lookFor) wrap.append(lookFor(item.lookFor));
      wrap.append(grid);
      return wrap;
    });
    return section('Before and After', ...blocks);
  }

  // An interactive item is the real screen shot with the element rebuilt over it in HTML and CSS: live, so
  // the reviewer can hover and press it, then frozen once per state, so the states read side by side and a
  // headless capture can shoot them. Each item's CSS is nested under its own block so items cannot clash.
  const STATE_CLASS = { hover: 'is-hover', press: 'is-press', focus: 'is-focus' };
  const THEMES = ['light', 'dark'];

  function stage(item, theme, live) {
    const box = el('div', `stage ${theme}${live ? ' live' : ''}`);
    box.style.width = `${item.width}px`;
    box.style.height = `${item.height}px`;
    const img = el('img');
    img.alt = `${item.label}, ${theme}`;
    img.src = item.background[theme];
    const overlay = el('div', 'overlay');
    overlay.innerHTML = item.overlay.html;
    // A frozen copy is a picture of a state: inert keeps it out of the pointer and the tab order alike.
    overlay.inert = !live;
    box.append(img, overlay);
    return box;
  }

  function freeze(box, state) {
    const targets = box.querySelectorAll(state.target);
    if (!STATE_CLASS[state.mode]) return `Mode "${state.mode}" is not hover, press, or focus`;
    if (!targets.length) return `Target "${state.target}" matched nothing in the overlay`;
    targets.forEach((node) => node.classList.add(STATE_CLASS[state.mode]));
    return null;
  }

  function stageTile(text, box, problem) {
    const tile = el('div', 'stage-tile');
    tile.append(el('div', 'colhead', text), box);
    if (problem) tile.append(el('div', 'stage-error', problem));
    return tile;
  }

  function interactiveBlock(item, index) {
    const wrap = el('div', 'interactive-item');
    wrap.dataset.interactive = index;
    const style = el('style');
    style.textContent = `[data-interactive="${index}"] { ${item.overlay.css || ''} }`;
    wrap.append(style, el('h3', '', item.label));
    if (item.lookFor) wrap.append(lookFor(item.lookFor));
    if (item.standIn) wrap.append(el('p', 'standin', item.standIn));
    const live = el('div', 'stages');
    THEMES.forEach((theme) => live.append(stageTile(theme === 'light' ? 'Light' : 'Dark', stage(item, theme, true))));
    const frozen = el('div', 'stages');
    for (const theme of THEMES) {
      frozen.append(stageTile(`At rest, ${theme}`, stage(item, theme, false)));
      for (const state of item.states || []) {
        const box = stage(item, theme, false);
        frozen.append(stageTile(`${state.name}, ${theme}`, box, freeze(box, state)));
      }
    }
    wrap.append(el('div', 'subhead', 'Live: Hover, Press, or Tab to It'), live, el('div', 'subhead', 'Every State, Frozen'), frozen);
    return wrap;
  }

  function interactiveSection() {
    return section('Interactive States', ...data.interactive.map(interactiveBlock));
  }

  function statesSection() {
    const blocks = data.states.flatMap((screen) => {
      const grid = el('div', 'states');
      screen.items.forEach((item) => {
        const card = el('div', 'state');
        const head = el('div', 'state-head');
        head.append(el('span', 'state-label', item.label), el('span', 'source', item.source));
        card.append(head, themePair(item, `${screen.screen}, ${item.label}`));
        grid.append(card);
      });
      return [el('h3', '', screen.screen), grid];
    });
    return section('Every State', ...blocks);
  }

  // One stacked block per finding: five table columns do not fit a phone-width sheet.
  function checkReport(report) {
    const skipped = [];
    if ((report.allow || []).length) skipped.push(`rules skipped with --allow: ${report.allow.join(', ')}`);
    if ((report.ignore || []).length) skipped.push(`elements left out with --ignore: ${report.ignore.join(', ')}`);
    const allowed = skipped.length ? ` Not checked: ${skipped.join('; ')}. The reason is in Open Questions or the summary.` : '';
    const items = report.findings.length ? report.findings.map((f) => {
      const node = el('div', 'check');
      const head = el('div', 'check-head');
      head.append(el('span', `level ${f.level}`, f.level), el('code', '', f.id), el('span', 'source', f.where.join(', ')));
      node.append(head, el('div', '', f.message), el('div', 'check-note', f.reason ? `Kept: ${f.reason}` : `Fix: ${f.fix}`));
      return node;
    }) : [el('p', '', 'No findings.')];
    return [el('h3', '', report.screen), ...items, el('p', 'footnote', `ui-inspect ran at ${report.ran.join(', ')}.${allowed}`)];
  }

  function checksSection() {
    return section('Measured Checks', ...data.checks.flatMap(checkReport));
  }

  function removedSection() {
    const node = table(['State', 'Why it cannot happen', 'Server citation']);
    data.removed.forEach((r) => {
      const row = el('tr');
      row.append(el('td', '', r.state), el('td', '', r.reason), td(el('code', '', r.citation)));
      node.append(row);
    });
    return section('Removed as Impossible', node);
  }

  function paritySection() {
    const node = table(['Change', 'Verdict', 'Note']);
    data.parity.forEach((p) => {
      const row = el('tr');
      row.append(el('td', '', p.change), td(el('span', `verdict ${p.verdict}`, p.verdict === 'matches' ? 'Matches' : 'Differs')), el('td', '', p.note));
      node.append(row);
    });
    return section('Reference Product Parity', node);
  }

  function optionsSection() {
    const items = data.options.map((o) => {
      const node = el('div', o.recommended ? 'option recommended' : 'option');
      const name = el('div', 'option-name', o.recommended ? `${o.name} (recommended)` : o.name);
      node.append(name, el('div', '', o.summary));
      return node;
    });
    return section('Options Considered', ...items);
  }

  function interactionsSection() {
    const node = table(['Target', 'Input', 'Result']);
    data.interactions.forEach((i) => {
      const row = el('tr');
      row.append(el('td', '', i.target), el('td', '', i.input), el('td', '', i.result));
      node.append(row);
    });
    return section('Interaction Notes', node);
  }

  function render() {
    const sheet = document.getElementById('sheet');
    sheet.append(header(), changesSection());
    if ((data.findings || []).length) sheet.append(findingsSection());
    if ((data.colors || []).length) sheet.append(colorsSection());
    if ((data.zooms || []).length) sheet.append(zoomsSection());
    if ((data.beforeAfter || []).length) sheet.append(beforeAfterSection());
    if ((data.interactive || []).length) sheet.append(interactiveSection());
    if ((data.states || []).length) sheet.append(statesSection());
    if ((data.checks || []).length) sheet.append(checksSection());
    if ((data.removed || []).length) sheet.append(removedSection());
    if ((data.parity || []).length) sheet.append(paritySection());
    if ((data.options || []).length) sheet.append(optionsSection());
    if ((data.interactions || []).length) sheet.append(interactionsSection());
    if ((data.notInScope || []).length) sheet.append(section('Not in This PR', list(data.notInScope)));
    sheet.append(section('Open Questions', list(data.questions, true)));
    sheet.append(el('p', 'footnote', `Captured ${data.captured} at ${data.viewport}. ${data.source}.`));
  }

  render();
</script>
