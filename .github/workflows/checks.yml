name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    # A release PR from an org member sets the new version on purpose; every other PR must leave it alone.
    if: >-
      github.event_name == 'pull_request' &&
      !(startsWith(github.head_ref, 'release/') &&
        contains(fromJSON('["MEMBER", "OWNER"]'), github.event.pull_request.author_association))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/version.mjs check "origin/${{ github.base_ref }}"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/*.test.mjs plugins/design-toolkit/tests/*.test.mjs
